<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Durga Psychiatric Centre — Welcome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: var(--bg-color);">

  <!-- Background Audio Element -->
  <audio id="splashAudio" src="ringtone.mp3" preload="auto" loop></audio>

  <div class="page-wrapper" style="text-align: center; width: 100%;">
    <div class="panel" style="display: flex; flex-direction: column; align-items: center; padding: 36px 20px;">
      <img src="profile.jpg" alt="Durga Psychiatric Centre" style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);">
      
      <span class="badge-tag" style="margin-bottom: 8px;">T Nagar · Chennai</span>
      <h1 style="font-size: 24px; margin-bottom: 6px; color: var(--text-main);">Durga Psychiatric Centre</h1>
      <p class="text-muted" style="font-size: 13.5px; margin-bottom: 8px;">Best Psychologist &amp; Mental Health Clinic</p>
      
      <!-- Visual notice for audio activation -->
      <p style="font-size: 11.5px; color: var(--primary); margin-bottom: 20px;">🎵 Tap anywhere to enable sound</p>
      
      <button id="enterBtn" class="btn" style="background-color: var(--primary); color: #0b1329; text-decoration: none; font-weight: 700; padding: 14px 24px; border-radius: 10px; display: block; width: 100%; box-shadow: 0 4px 12px rgba(56,189,248,0.3); font-size: 15px; border: none; cursor: pointer;">
        Enter Site ➔
      </button>
    </div>
  </div>

  <script>
    const audio = document.getElementById('splashAudio');
    
    // Function to trigger audio playback on first interaction
    const unlockAudio = () => {
      audio.play().then(() => {
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
      }).catch(err => {
        console.log("Audio playback blocked:", err);
      });
    };

    // Listen for any click or touch on the page to satisfy browser autoplay requirements
    window.addEventListener('click', unlockAudio);
    window.addEventListener('touchstart', unlockAudio);

    // Attempt automatic playback on load
    audio.play().catch(() => {
      // Handled by the window event listeners above if blocked
    });

    // When Enter is clicked, stop audio and redirect to main site
    document.getElementById('enterBtn').addEventListener('click', function(e) {
      e.preventDefault();
      audio.pause();
      audio.currentTime = 0;
      window.location.href = 'home.html';
    });
  </script>

</body>
</html>
