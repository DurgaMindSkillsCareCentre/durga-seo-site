<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Durga Psychiatric Centre — Welcome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: var(--bg-color);">

  <!-- Background Audio Element -->
  <audio id="splashAudio" src="ringtone.mp3" preload="auto" loop></audio>

  <div class="page-wrapper" style="text-align: center; width: 100%;">
    <div class="panel" style="display: flex; flex-direction: column; align-items: center; padding: 36px 20px;">
      <img src="profile.jpg" alt="Durga Psychiatric Centre" style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);">
      
      <span class="badge-tag" style="margin-bottom: 8px;">T Nagar · Chennai</span>
      <h1 style="font-size: 24px; margin-bottom: 6px; color: var(--text-main);">Durga Psychiatric Centre</h1>
      <p class="text-muted" style="font-size: 13.5px; margin-bottom: 16px;">Best Psychologist &amp; Mental Health Clinic</p>
      
      <!-- Manual Audio Toggle Button -->
      <button id="audioToggleBtn" style="background: #1b2a4a; color: var(--primary); border: 1px solid var(--primary); padding: 12px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px; width: 100%; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
        🔊 Play Welcome Music
      </button>
      
      <!-- Enter Site Button -->
      <button id="enterBtn" class="btn" style="background-color: var(--primary); color: #0b1329; text-decoration: none; font-weight: 700; padding: 14px 24px; border-radius: 10px; display: block; width: 100%; box-shadow: 0 4px 12px rgba(56,189,248,0.3); font-size: 15px; border: none; cursor: pointer;">
        Enter Site ➔
      </button>
    </div>
  </div>

  <script>
    const audio = document.getElementById('splashAudio');
    const audioBtn = document.getElementById('audioToggleBtn');

    // Reliable manual playback toggle via direct button click
    audioBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (audio.paused) {
        audio.play().then(() => {
          audioBtn.innerHTML = '🔇 Pause Music';
          audioBtn.style.background = 'rgba(56, 189, 248, 0.15)';
        }).catch(err => {
          console.error("Playback error:", err);
        });
      } else {
        audio.pause();
        audioBtn.innerHTML = '🔊 Play Welcome Music';
        audioBtn.style.background = '#1b2a4a';
      }
    });

    // Cleanly stop audio and navigate to the main site when Enter is clicked
    document.getElementById('enterBtn').addEventListener('click', function(e) {
      e.preventDefault();
      audio.pause();
      audio.currentTime = 0;
      window.location.href = 'home.html';
    });
  </script>

</body>
</html>
